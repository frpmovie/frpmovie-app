name: Compilar APK FRP Movie

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Recuperar keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/frpmovie-release.keystore

      - name: Compilar APK release firmado
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: frpmovie-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: FRP-Movie-APK
          path: app/build/outputs/apk/release/app-release.apk