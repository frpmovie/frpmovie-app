name: Compilar APK FRP Movie

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Recuperar keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/frpmovie-release.keystore

      - name: Compilar APK release firmado
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: frpmovie-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: FRP-Movie-APK
          path: app/build/outputs/apk/release/app-release.apk

      # El artifact de arriba requiere iniciar sesión en GitHub para
      # descargarlo, lo que en el navegador del celular a veces termina en
      # una descarga incompleta/corrupta (y Play Protect lo marca como
      # "dañado"). Un Release público sirve el .apk directo, sin login.
      - name: Publicar release público (descarga directa, sin login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "FRP Movie build ${{ github.run_number }}"
          make_latest: true
          files: app/build/outputs/apk/release/app-release.apk